services:

  backend:
    build: ./app
    container_name: fastapi-backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
      - chromadb
      - embedding-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDING_SERVER_URL=http://embedding-service:8000/embed
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

  frontend:
    build: ./frontend
    container_name: streamlit-frontend
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000

  embedding-service:
    build: ./embedding-service
    container_name: embedding-service
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    ports:
      - "127.0.0.1:8003:8000"   # expose Chroma REST API on localhost only
    environment:
      - IS_PERSISTENT=TRUE          # enables persistence on disk
      - ALLOW_RESET=${CHROMA_ALLOW_RESET:-FALSE}   # set to TRUE only for local dev
    volumes:
      - ./chroma:/data  # mount local folder into container
    restart: unless-stopped

volumes:
  redis-data:
