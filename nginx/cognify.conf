# Nginx site config for Cognify.
# Install on the EC2 host at /etc/nginx/sites-available/cognify.conf and
# symlink into sites-enabled. Replace YOUR_DOMAIN before use.
# Certbot (certbot --nginx) will rewrite this file to add the TLS server
# block automatically the first time you run it.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit frontend (needs websocket upgrade for live UI updates)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
